# The app bundle (XcodeGen spec; ExitControl.xcodeproj is generated, not committed).
# The code lives in the Swift package next to it: ExitControlCore (library, tested with
# `swift test`) and Sources/ExitControl (the app target below).
name: ExitControl
options:
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
packages:
  ExitControlPackage: { path: . }
  Sparkle:   # in-app updates (PLAN Phase 5c); bump deliberately
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
targets:
  ExitControlApp:   # not "ExitControl": the package's executable product has that name
    type: application
    platform: macOS
    scheme: {}
    sources: [Sources/ExitControl]
    dependencies:
      - package: ExitControlPackage
        product: ExitControlCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: ExitControl
        PRODUCT_BUNDLE_IDENTIFIER: org.exit-vpn.ExitControl
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ONLY_ACTIVE_ARCH: NO
