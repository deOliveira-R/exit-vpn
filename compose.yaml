# exit-vpn: a Tailscale exit node whose internet egress is a VPN provider's WireGuard
# tunnel, with a kill switch (PLAN.md). Settings come from .env (see .env.example);
# WireGuard configs live in ./secrets (root, 0700/0600). Never in git.
name: exit-vpn

x-logging: &logging
  options:
    max-size: 20m
    max-file: "5"

services:
  exit:
    build:
      context: .
      dockerfile: exit/Dockerfile
    image: exit-vpn/exit:latest
    container_name: ${EXIT_NODE_NAME:-exit-proton}
    hostname: ${EXIT_NODE_NAME:-exit-proton}
    restart: unless-stopped
    environment:
      EXIT_VPN_CONF: /secrets/${EXIT_VPN_CONF:-proton_a.conf}
      WG_MTU: ${WG_MTU:-1420}
      EXIT_NODE_NAME: ${EXIT_NODE_NAME:-exit-proton}
      TS_TAGS: ${TS_TAGS:-tag:exit}
      TS_PORT: ${TS_PORT:-41642}
      # The image has no iptables binary; tailscaled programs nftables over netlink
      TS_DEBUG_FIREWALL_MODE: nftables
      # Controller (Phase 3): tailnet logins allowed to use the API, country preference
      EXIT_OWNERS: ${EXIT_OWNERS:?set EXIT_OWNERS in .env}
      EXIT_COUNTRIES: ${EXIT_COUNTRIES:-United States,Switzerland}
      VPN_PROVIDER: ${VPN_PROVIDER:-proton}
      CATALOG_URL: ${CATALOG_URL:-}
      API_PORT: ${API_PORT:-8080}
      PROBER_URL: http://${PROBER_IP:-172.30.42.10}:9000
      # Slot b's bootstrap config, for GET /v1/keys and rollback (the prober mounts it)
      PROBE_VPN_CONF: /secrets/${PROBE_VPN_CONF:-proton_b.conf}
    # Only what routing, WireGuard and (Phase 2) tailscaled need; s6-overlay runs
    # without further capabilities (tested).
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    devices: [/dev/net/tun:/dev/net/tun]
    # Namespaced: these change only the container's network namespace, not the host.
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv4.conf.default.rp_filter: "2"
      # tailscaled's connmark-based rp_filter workaround
      net.ipv4.conf.all.src_valid_mark: "1"
      # On so IPv6 exit traffic hits the unreachable route (fast ICMP error, clients fall
      # back to IPv4) instead of a silent drop. No IPv6 leaves the node yet (PLAN Q6).
      net.ipv6.conf.all.forwarding: "1"
    # Docker's embedded resolver forwards to the VPN's DNS, which is only reachable
    # through the tunnel (ip rule 120 + nftables), so DNS fails closed without it.
    dns:
      - "${VPN_DNS:-10.2.0.1}"
    read_only: true
    # s6-overlay executes from /run, so it must not be noexec
    tmpfs:
      - /run:exec,mode=755
      - /tmp
    volumes:
      - ./secrets:/secrets:ro
      # Key slots uploaded via PUT /v1/keys (PLAN Phase 3b); empty = use secrets/
      - keys-a:/keys/a
      - keys-b:/keys/b
      - exit-state:/var/lib/exit-vpn
      - ts-state:/var/lib/tailscale
    # tailscaled's WireGuard port for direct connections (the host's tailscaled has 41641).
    # The OCI security list stays closed for now: NAT traversal first (PLAN V5/T5).
    ports:
      - "${TS_PORT:-41642}:${TS_PORT:-41642}/udp"
    networks:
      exitnet:
        ipv4_address: ${EXIT_IP:-172.30.42.2}
    mem_limit: ${EXIT_MEMORY:-512m}
    logging: *logging

  # Probes URLs through other VPN servers on its own tunnel (key B), never the active
  # exit's (PLAN Phase 4, D11/D19). Reachable only from the exit container.
  prober:
    build:
      context: .
      dockerfile: prober/Dockerfile
    image: exit-vpn/prober:latest
    container_name: ${EXIT_NODE_NAME:-exit-proton}-prober
    restart: unless-stopped
    environment:
      PROBE_VPN_CONF: /secrets/${PROBE_VPN_CONF:-proton_b.conf}
      EXITNET_SUBNET: ${EXITNET_SUBNET:-172.30.42.0/24}
      EXIT_IP: ${EXIT_IP:-172.30.42.2}
      HOME: /tmp
    # NET_ADMIN for wg-probe/nftables; SETUID/SETGID/CHOWN/KILL to run Chromium as the
    # unprivileged 'browser' user (it renders arbitrary sites) and to stop it again.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, KILL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.conf.all.rp_filter: "2"
    dns:
      - "${VPN_DNS:-10.2.0.1}"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 512m
    volumes:
      - ./secrets/${PROBE_VPN_CONF:-proton_b.conf}:/secrets/${PROBE_VPN_CONF:-proton_b.conf}:ro
      - keys-b:/keys/b:ro
    networks:
      exitnet:
        ipv4_address: ${PROBER_IP:-172.30.42.10}
    mem_limit: ${PROBER_MEMORY:-2g}
    pids_limit: 512
    logging: *logging

networks:
  exitnet:
    ipam:
      config:
        - subnet: ${EXITNET_SUBNET:-172.30.42.0/24}

volumes:
  exit-state: {}
  keys-a: {}
  keys-b: {}
  ts-state: {}
