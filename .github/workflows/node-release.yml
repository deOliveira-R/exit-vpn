# PLAN Phase D: a node-v* tag builds the exit and prober images for amd64 and arm64 (native
# runners, no emulation), pushes them to GHCR with build provenance and an SBOM, attests the
# provenance (`gh attestation verify`), and publishes a GitHub Release with the deploy kit.
# The release is never "latest": the app's update feed is releases/latest (an app release).
name: node-release
on:
  push: { tags: ["node-v[0-9]+.[0-9]+.[0-9]+"] }
permissions: { contents: read }
concurrency: { group: node-release }

env:
  REGISTRY: ghcr.io
  OWNER: deoliveira-r          # GHCR names are lower-case

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        image: [exit, prober]
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/exit-vpn-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${d#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ github.token }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { path: "${{ runner.temp }}/digests", pattern: "digests-*" }
      - name: One multi-arch image per component, tagged with the version
        id: merge
        run: |
          v="${GITHUB_REF_NAME#node-v}"
          for img in exit prober; do
            repo="$REGISTRY/$OWNER/exit-vpn-$img"
            refs=$(for d in "$RUNNER_TEMP"/digests/digests-$img-*/*; do echo "$repo@sha256:$(basename "$d")"; done)
            docker buildx imagetools create -t "$repo:$v" -t "$repo:latest" $refs
            digest=$(docker buildx imagetools inspect "$repo:$v" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$img=$digest" >> "$GITHUB_OUTPUT"
            echo "$repo:$v → $digest"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with: { subject-name: "${{ env.REGISTRY }}/${{ env.OWNER }}/exit-vpn-exit", subject-digest: "${{ steps.merge.outputs.exit }}", push-to-registry: true }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with: { subject-name: "${{ env.REGISTRY }}/${{ env.OWNER }}/exit-vpn-prober", subject-digest: "${{ steps.merge.outputs.prober }}", push-to-registry: true }
      - name: Release with the deploy kit (never "latest")
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="${GITHUB_REF_NAME#node-v}"
          kit="exit-vpn-node-$v"
          mkdir -p "$RUNNER_TEMP/$kit"
          cp compose.yaml .env.example deploy/install.sh deploy/README.md "$RUNNER_TEMP/$kit/"
          {
            echo "EXIT_IMAGE=$REGISTRY/$OWNER/exit-vpn-exit:$v@${{ steps.merge.outputs.exit }}"
            echo "PROBER_IMAGE=$REGISTRY/$OWNER/exit-vpn-prober:$v@${{ steps.merge.outputs.prober }}"
          } > "$RUNNER_TEMP/$kit/images.env"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$kit.tar.gz" "$kit"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Exit node images (amd64, arm64), pinned by digest:

              $REGISTRY/$OWNER/exit-vpn-exit:$v@${{ steps.merge.outputs.exit }}
              $REGISTRY/$OWNER/exit-vpn-prober:$v@${{ steps.merge.outputs.prober }}

          Verify before deploying: \`gh attestation verify oci://<image>@<digest> --repo ${{ github.repository }}\`.
          New host: unpack the kit and follow its README (install.sh). Existing host: \`deploy/rollout.sh $v\` from the Mac.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "Exit node $v" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/$kit.tar.gz"
