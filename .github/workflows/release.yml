# App release: a v* tag builds the signed app, its Sparkle appcast, and a GitHub Release.
# The app's feed is releases/latest/download/appcast.xml, so publishing is the update.
# Secrets: MACOS_SIGNING_P12 (base64 .p12 of the Apple Development identity),
# MACOS_SIGNING_P12_PASSWORD, MACOS_DEVELOPMENT_TEAM, SPARKLE_ED_KEY (generate_keys -x).
name: release
on:
  push: { tags: ["v[0-9]+.[0-9]+.[0-9]+"] }
permissions: { contents: write }
concurrency: { group: release }

jobs:
  app:
    runs-on: macos-26
    env:
      WWDR_G3_SHA256: dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }   # the build number is the commit count
      - run: brew install xcodegen
      - name: Tests
        working-directory: mac/ExitControl
        run: swift test
      - name: Signing keychain
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          curl -sSfL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          echo "$WWDR_G3_SHA256  $RUNNER_TEMP/wwdr.cer" | shasum -a 256 -c
          security import "$RUNNER_TEMP/wwdr.cer" -k "$kc"
          (umask 077; printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12")
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_IDENTITY = Apple Development\n' "$TEAM" > mac/ExitControl/Local.xcconfig
          security find-identity -v -p codesigning "$kc" | tail -1
      - name: Build, sign, appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          (umask 077; printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/ed.key")
          SPARKLE_ED_KEY_FILE="$RUNNER_TEMP/ed.key" mac/ExitControl/release.sh "${GITHUB_REF_NAME#v}" "$(git rev-list --count HEAD)"
          rm -f "$RUNNER_TEMP/ed.key"
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          First install: unzip, move ExitControl.app to Applications, then right-click → Open once
          (the app is signed but not notarized). Later versions arrive through Check for Updates.
          It drives \`exitctl\` for provider actions: install it from this tag's \`helper/\` (see the app README).
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ExitControl $v" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            "mac/ExitControl/build/release/ExitControl-$v.zip" mac/ExitControl/build/release/appcast.xml
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
